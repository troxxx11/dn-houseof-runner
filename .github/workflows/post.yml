name: post
on:
  schedule:
    - cron: '7 */3 * * *'   # safety net; the run below keeps itself alive by re-dispatching
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: wait for due reels and post them on time
        env:
          FB_API: ${{ secrets.FB_API }}
          FB_IG_ID: ${{ secrets.FB_IG_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 runner.py
      - name: hand over to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post.yml -R ${{ github.repository }} || true
